name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/tui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/tui
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo clippy --locked --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features full
      - run: cargo build --locked
      - name: Default tree excludes Praefectus
        run: |
          if cargo tree -p telekinesis --locked -i praefectus >/tmp/praefectus-tree 2>/tmp/praefectus-err; then
            echo "default features must not depend on praefectus"
            cat /tmp/praefectus-tree
            exit 1
          fi
