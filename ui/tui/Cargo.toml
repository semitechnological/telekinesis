[package]
name = "telekinesis"
version = "0.5.8"
edition = "2021"
license = "MPL-2.0"
description = "AI coding agent TUI — rx4 harness + crepuscularity-tui, pi-first UX"
repository = "https://github.com/tschk/telekinesis"
homepage = "https://github.com/tschk/telekinesis"
keywords = ["ai", "agent", "cli", "tui", "coding"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "tk"
path = "src/main.rs"

[features]
default = ["pi-compat"]
pi-compat = []
computer-use = ["rx4/computer-use"]
skills = ["rx4/skills"]
graph-memory = ["rx4/graph-memory"]
full = ["computer-use", "skills", "graph-memory"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
crepuscularity-tui = "0.4.23"
crossterm = "0.29"
charmed-glamour = "0.2.0"
ansi-to-tui = { version = "8.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rs_ai_oauth = "0.2.31"
rx4 = { version = "0.6.4", default-features = false, features = ["providers", "builtin-tools", "mcp"] }
darash = "0.4.0"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
